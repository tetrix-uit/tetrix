[agents.artifact-master]
config_file = "agents/artifact-master.toml"
description = "Coordinates one artifact-driven change phase by phase with Plan-Pn then Build-Pn. Owns all expert spawning and coordination only, owns no phase content, and delegates each phase to its content owner. Use for coordinating a change, planning then building a phase, or running the next artifact phase."

[agents.artifact-release-expert]
config_file = "agents/artifact-release-expert.toml"
description = "Copies one feature version in phase 5. Owns the copy, the replacement, the deletion, and the feature README update. Does not edit a copied artifact and does not run a design step. Returns a missing-readiness query to the artifact master. Use when phase 5 starts, after the solution expert confirms readiness."

[agents.e2e-expert]
config_file = "agents/e2e-expert.toml"
description = "Implements the shared end-to-end tests in e2e/: one test per workflow that uses more than one application or service. Owns phase 4 of the artifact-driven documentation model for that component. Use for a task that changes e2e/, or when the solution expert needs the specifications or the tasks of the end-to-end tests."

[agents.lib-expert]
config_file = "agents/lib-expert.toml"
description = "Implements the shared libraries in libs/: the shared kernels, the published languages, and the technical libraries, with their consumers. Owns phase 4 of the artifact-driven documentation model for those components. Use for a task that changes libs/, or when the solution expert needs the specifications or the tasks of a library."

[agents.requirement-expert]
config_file = "agents/requirement-expert.toml"
description = "Gathers the business need and writes the change summary and the requirements of a feature. Owns phase 1 content of the artifact-driven documentation model. Calls no subagent and directly tasks no expert. Use when a new feature starts, or when a change to a feature starts."

[agents.solution-expert]
config_file = "agents/solution-expert.toml"
description = "Designs the solution for a feature and writes the specifications, the decisions, and the implementation plan. Owns phases 2 and 3 content of the artifact-driven documentation model, and the phase 5 readiness gate. Calls no subagent and directly tasks no expert; it sends each feasibility-review and owner-selection request to the artifact master. Use when phase 2 or phase 3 of a change starts."

[agents.tetrix-expert]
config_file = "agents/tetrix-expert.toml"
description = "Implements the Tetrix game in apps/tetrix: the game core with its rules, the game loop, the input, the rendering, and the on-device storage. The game has no backend. Owns phase 4 of the artifact-driven documentation model for that component. Use for a task that changes apps/tetrix, or when the solution expert needs the specifications or the tasks of the game."
